<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Colombie — Carnet de voyage</title>
  <meta name="description" content="Carnet de voyage hors-ligne : 14 jours en Colombie, du 13 au 26 août.">

  <!-- Thème -->
  <meta name="theme-color" content="#C45A32" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)">

  <!-- PWA / iOS "ajouter à l'écran d'accueil" -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Colombie">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Bandeau hors-ligne (affiché via body.is-offline) -->
  <div class="offline-banner" role="status" aria-live="polite">
    Hors ligne — toutes les infos du voyage restent disponibles
  </div>

  <main id="app">

    <!-- ============ VUE 1 : AUJOURD'HUI ============ -->
    <section class="view active" id="view-today" data-view="today"
             role="tabpanel" aria-label="Fiche du jour">
      <div class="view-header">
        <h1>Aujourd'hui</h1>
        <span class="view-sub" id="today-progress"></span>
      </div>
      <div id="day-card-mount"></div>
    </section>

    <!-- ============ VUE 2 : CALENDRIER ============ -->
    <section class="view" id="view-calendar" data-view="calendar"
             role="tabpanel" aria-label="Calendrier des 14 jours">
      <div class="view-header">
        <h1>Calendrier</h1>
        <span class="view-sub">14 jours · 13 → 26 août</span>
      </div>
      <div id="calendar-mount"></div>
    </section>

    <!-- ============ VUE 3 : CARTE ============ -->
    <section class="view" id="view-map" data-view="map"
             role="tabpanel" aria-label="Carte de l'itinéraire">
      <div class="view-header">
        <h1>Carte</h1>
        <span class="view-sub">4 grandes étapes</span>
      </div>

      <div class="map-wrap">
        <!-- SVG inline fait main : silhouette + 4 étapes numérotées.
             viewBox sans largeur/hauteur fixes pour rester responsive. -->
        <svg viewBox="0 0 300 380" role="img"
             aria-label="Tracé schématique de l'itinéraire en Colombie, de Medellín à Carthagène.">
          <title>Itinéraire — Medellín, Salento, la côte caraïbe, Carthagène</title>

          <!-- Silhouette stylisée de la Colombie -->
          <path d="M150 20
                   C110 26 92 54 96 92
                   C74 108 60 140 70 176
                   C58 208 62 250 88 286
                   C104 320 118 348 150 360
                   C176 350 190 322 198 292
                   C224 268 236 226 224 190
                   C240 156 232 112 206 92
                   C210 54 190 28 150 20 Z"
                fill="var(--bg-sunken)" stroke="var(--border-strong)"
                stroke-width="1.5"/>

          <!-- Tracés entre étapes -->
          <!-- 1 Medellín -> 2 Salento : AVION (pointillés) -->
          <path d="M150 250 L108 300" fill="none" stroke="var(--color-coffee)"
                stroke-width="3" stroke-dasharray="4 6" stroke-linecap="round"/>
          <!-- 2 Salento -> 3 Côte : AVION (pointillés) -->
          <path d="M108 300 L196 96" fill="none" stroke="var(--color-carib)"
                stroke-width="3" stroke-dasharray="4 6" stroke-linecap="round"/>
          <!-- 3 Côte -> 4 Carthagène : BUS/ROUTE (trait plein) -->
          <path d="M196 96 L120 70" fill="none" stroke="var(--color-colonial)"
                stroke-width="3" stroke-linecap="round"/>

          <!-- Point 4 : Carthagène (haut, côte nord-ouest) -->
          <circle cx="120" cy="70" r="15" fill="var(--color-colonial)"/>
          <text x="120" y="75" text-anchor="middle" font-size="15"
                font-weight="700" fill="#fff">4</text>

          <!-- Point 3 : Côte & parcs (nord-est) -->
          <circle cx="196" cy="96" r="15" fill="var(--color-jungle)"/>
          <text x="196" y="101" text-anchor="middle" font-size="15"
                font-weight="700" fill="#fff">3</text>

          <!-- Point 1 : Medellín (centre) -->
          <circle cx="150" cy="250" r="15" fill="var(--color-city)"/>
          <text x="150" y="255" text-anchor="middle" font-size="15"
                font-weight="700" fill="#fff">1</text>

          <!-- Point 2 : Salento & Cocora (sud-ouest) -->
          <circle cx="108" cy="300" r="15" fill="var(--color-coffee)"/>
          <text x="108" y="305" text-anchor="middle" font-size="15"
                font-weight="700" fill="#fff">2</text>
        </svg>
      </div>

      <div class="map-legend" id="map-legend-mount"></div>

      <h2 class="cal-week-label">Étapes du voyage</h2>
      <div class="stage-list" id="stage-list-mount"></div>
    </section>

    <!-- ============ VUE 4 : PRATIQUE ============ -->
    <section class="view" id="view-practical" data-view="practical"
             role="tabpanel" aria-label="Informations pratiques">
      <div class="view-header">
        <h1>Pratique</h1>
      </div>

      <div class="pills" role="tablist" aria-label="Sous-sections pratiques">
        <button class="pill active" data-subview="legs" role="tab" aria-selected="true">Trajets</button>
        <button class="pill" data-subview="budget" role="tab" aria-selected="false">Budget</button>
        <button class="pill" data-subview="info" role="tab" aria-selected="false">Infos utiles</button>
      </div>

      <div class="subview active" id="subview-legs"><div id="legs-mount"></div></div>
      <div class="subview" id="subview-budget"><div id="budget-mount"></div></div>
      <div class="subview" id="subview-info"><div id="info-mount"></div></div>
    </section>

  </main>

  <!-- Bouton flottant "Aujourd'hui" toujours accessible -->
  <button class="today-fab hidden" id="today-fab" aria-label="Aller au jour du voyage en cours">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.2" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
    </svg>
    Aujourd'hui
  </button>

  <!-- Tab bar (bas d'écran) -->
  <nav class="tabbar" role="tablist" aria-label="Navigation principale">
    <button class="tab active" data-target="today" role="tab" aria-selected="true" aria-label="Aujourd'hui">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/>
      </svg>
      Aujourd'hui
    </button>
    <button class="tab" data-target="calendar" role="tab" aria-selected="false" aria-label="Calendrier">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>
      </svg>
      Calendrier
    </button>
    <button class="tab" data-target="map" role="tab" aria-selected="false" aria-label="Carte">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/>
      </svg>
      Carte
    </button>
    <button class="tab" data-target="practical" role="tab" aria-selected="false" aria-label="Pratique">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
      </svg>
      Pratique
    </button>
  </nav>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
